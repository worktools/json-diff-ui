name: check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Moonbit
        uses: hustcer/setup-moonbit@v1
        with:
          version: "nightly"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "yarn"

      - name: moon check
        run: moon update && moon check --target js

      # - name: moon info
      #   run: |
      #     moon info
      #     git diff --exit-code

      - name: moon test
        run: |
          moon build --target js --debug

      - name: "compiles to js"
        run: yarn && yarn vite build --base=./

      # - name: moon bundle
      #   run: moon bundle

      # - name: check core size
      #   run: ls -alh `find ./target/bundle -name *.core`

      # - name: format diff
      #   run: |
      #     moon fmt
      #     git diff

      - name: Deploy to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deploy
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"

      # Shadow upload follows the existing production deployment.
      - name: Select COS prefix
        id: cos-path
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "prefix=${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=${GITHUB_REPOSITORY}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload static assets to COS
        if: steps.cos-path.outcome == 'success'
        uses: worktools/cos-upload-action@0ce57b26b03dbdd27a4a544a06d453415932c62d # v1.0.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.cos-path.outputs.prefix }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Verify uploaded page through public CDN
        if: steps.cos-path.outcome == 'success'
        env:
          COS_ASSET_PREFIX: ${{ steps.cos-path.outputs.prefix }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --location --retry 2 --retry-delay 2 --retry-all-errors \
              "https://cos-sh.tiye.me/${COS_ASSET_PREFIX}index.html?run=${GITHUB_RUN_ID}-${attempt}" \
              --output "$RUNNER_TEMP/cos-index.html" && \
              cmp -s dist/index.html "$RUNNER_TEMP/cos-index.html"; then
              echo "CDN index.html matches dist/index.html on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done
          echo 'CDN index.html did not match dist/index.html after 6 attempts' >&2
          exit 1
